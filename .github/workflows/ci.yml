name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Network-free smoke test: proves the built CLI bundle runs (shebang,
      # ESM entrypoint guard, arg parsing) without depending on live OSV/registry.
      - name: CLI smoke test
        run: |
          node apps/cli/dist/cli.js --version
          node apps/cli/dist/cli.js --help

  # The ml/ lab is Python-only, but its feature extraction is a hard contract
  # with packages/core/src/name-model.ts — the pytest suite pins feature values
  # so drift between the two implementations breaks loudly.
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install -r ml/requirements.txt

      - name: Test
        run: python -m pytest tests -q
        working-directory: ml
